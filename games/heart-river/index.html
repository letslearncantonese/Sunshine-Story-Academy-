<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111525"><title>狐狸心字部冒險｜心之河流</title><meta name="description" content="跳上心字部嘅字，穿過二十行石陣，避開水柱，攞魔法雨靴追寶石！"><link rel="stylesheet" href="style.css?v=4"></head><body><main id="game"><canvas id="scene" width="1280" height="720" aria-label="庭園河流，二十行石頭，每行三粒"></canvas><header><div><small>狐狸心字部冒險</small><h1>心之河流</h1></div><div class="progress"><span id="count">0 / 20</span><div id="dots"></div></div><div class="tools"><button id="sound" aria-label="開關音效">音效：開</button><button id="testSound" aria-label="試聽廣東話讀音">讀音</button><button id="restart">重新開始</button></div></header><div id="choices" aria-label="下一行石頭"></div><div id="warning" role="status" aria-live="polite" hidden></div><nav id="actions" aria-label="狐狸動作"><div><button id="left" disabled>◀ 跑左</button><button id="right" disabled>跑右 ▶</button></div><div><button id="duck" disabled>踎低</button><button id="up" disabled>跳起</button></div></nav><footer><strong id="hint" role="status" aria-live="polite">撳下一行嘅石頭，揀心字部嘅字！</strong><div id="voiceStatus" role="status">撳石頭聽廣東話讀音</div><div id="collection" aria-label="已收集嘅心字部嘅字"></div></footer><div id="overlay" class="hidden"><section><small id="resultTag"></small><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">再玩一次</button></section></div><div id="loading">準備入庭園…</div></main><p class="orientation">橫放電話或 iPad，石頭會睇得更清楚。鍵盤：1／2／3 揀石頭，↓ 踎低，空白鍵跳起，← → 跑。</p><script src="game.js?v=7"></script></body></html>
