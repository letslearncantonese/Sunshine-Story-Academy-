<!doctype html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#074777"><title>光線感測器</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../assets/science-game-nav.css"></head>
<body><main id="game" class="game" aria-label="光線感測器遊戲">
<div id="scene" class="scene" aria-hidden="true"><div class="scene-image"></div><canvas id="weather"></canvas></div><div class="weather-label" id="weather-label">日出</div>
<header><h1>光線感測器</h1><div class="clocks"><div class="success"><span>成功時間</span><strong id="success">0.0<small> 秒</small></strong></div><div class="remaining"><span>剩餘</span><strong id="remaining">60<small> 秒</small></strong></div><button id="mute" class="sound" aria-label="關閉音效" aria-pressed="false">♪</button></div></header>
<section class="meter-panel" aria-label="光度計"><div class="meter-heading">光度 <strong id="reading">58%</strong></div><div class="scale">
<div class="ticks"><span style="bottom:100%">100%</span><span style="bottom:80%">80%</span><span style="bottom:60%">60%</span><span style="bottom:40%">40%</span><span style="bottom:20%">20%</span><span style="bottom:0%">0%</span></div>
<div class="track" role="meter" aria-label="目前光度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58"><div class="target"><i>65%</i><b>目標<br>50–65%</b><em>50%</em></div><div class="needle" id="needle"></div></div></div><div id="status" class="status">目標 50–65%</div></section>
<div class="robot" id="robot" aria-hidden="true"><canvas id="robot-up"></canvas><canvas id="robot-down"></canvas><canvas id="robot-pose" width="560" height="820"></canvas></div>
<div id="mat-feedback" class="mat-feedback" aria-hidden="true"></div><div id="forecast" class="forecast" role="status" hidden></div><section class="controls" aria-label="光度控制"><button id="up" class="control up" aria-label="趷高，光度上升，按住上方向鍵"><span class="arrow">↑</span><span><b>趷高</b><small>開簾／亮燈</small></span></button><button id="down" class="control down" aria-label="踎低，光度下降，按住下方向鍵"><span class="arrow">↓</span><span><b>踎低</b><small>暗燈／關簾</small></span></button><p>按住按鈕／鍵盤 ↑ ↓</p><p id="device-status">百葉簾 · 燈光</p></section>
<div id="overlay" class="overlay"><section id="card" class="card"><div class="eyebrow">60 秒 · 一日縮影</div><h2>光線感測器</h2><p>將光度保持喺 <b>50%–65%</b><br>留喺綠色範圍越耐越好！</p><button id="start" class="primary" disabled>準備中…</button><small class="sound-note">想聽到音效，記得開啟裝置聲音</small></section><div id="countdown" class="countdown" hidden aria-live="assertive"></div></div>
</main><script type="module" src="game.js"></script><a class="science-game-back" href="../../science/smart-home/" aria-label="返回智能家居遊戲館">⌂ 返回智能家居</a></body></html>
