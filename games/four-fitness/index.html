<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13284a"><title>四的乘法忍者挑戰</title>
<link rel="stylesheet" href="style.css"><script src="game.js" defer></script>
</head>
<body>
<main id="game">
<header><span class="brand">4 × 忍者挑戰</span><div id="progress" aria-label="遊戲進度"></div><button id="sound" class="sound" aria-label="關閉音效" aria-pressed="false">♪ 音效開</button></header>
<section id="start" class="screen intro">
<div class="badge">動腦筋 · 郁身體</div><h1>四的乘法<br><span>忍者挑戰</span></h1><p>諗好答案，郁 10 秒，再開估！</p><button id="startButton" class="primary">開始！ <span aria-hidden="true">▶</span></button><div class="sub">5 題挑戰 · 每個答案都有指定動作</div>
</section>
<section id="question" class="screen board" hidden>
<div class="questionBanner"><span id="questionProgress"></span><h2 id="equation"></h2><span class="bannerLabel">諗答案，跟住郁！</span></div>
<div id="answers"></div>
<div class="boardBottom">
<div class="boardInstruction"><strong id="exerciseName">揀一個答案</strong><span id="exercisePrompt">做指定動作 10 秒，先開估！</span><span id="feedback" role="status" aria-live="polite"></span></div>
<div class="clockBox"><div id="timer" role="timer" aria-label="剩餘秒數">00:10</div><div class="timerTrack"><div id="timerFill"></div></div></div>
<div class="boardStatus"><button id="roundStart" class="primary">開始倒數 ▶</button><strong id="exerciseFeedback">準備好未？</strong><span id="loading" hidden>忍者準備中…</span><button id="retryVideo" hidden>撳呢度播放</button></div>
</div>
</section>
<section id="finish" class="screen intro" hidden><div class="finishStars" aria-hidden="true">★ ★ ★ ★ ★</div><h1>挑戰完成！</h1><p>你完成咗 5 題四的乘法！</p><div class="finishTag">動腦又郁身，你做到啦！</div><button id="replay" class="primary">再玩一次 <span aria-hidden="true">↻</span></button></section>
<footer><span>四的乘法 × 運動挑戰</span><span id="footerHint">留返少少空位，一齊郁！</span></footer>
</main>
</body></html>
