<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>心字部接燈籠大作戰</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#00ff00;font-family:system-ui,"PingFang HK","Microsoft JhengHei",sans-serif;color:#40261e;touch-action:none}body{display:grid;place-items:center}#stage{position:relative;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);container-type:inline-size;background:#00ff00;overflow:hidden}canvas{width:100%;height:100%;display:block}button{font:inherit;font-weight:900;border:3px solid #573322;border-radius:18px;background:#ffe3a0;color:#40261e;padding:.6em 1em;touch-action:none}button:disabled{opacity:.45}button.active{background:#ffb52c}#panel{position:absolute;top:7%;left:24%;width:68%;height:86%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.2cqw;background:#fff6df;border:5px solid #693d27;border-radius:30px;text-align:center;padding:2cqw}h1{font-size:3.2cqw;margin:0}p{font-size:1.65cqw;line-height:1.55;margin:0}.choices{display:flex;gap:1cqw}.choices button,#start,#again{font-size:2cqw}#start,#again{background:#ffc23d;padding:.65em 2.5em}label{font-size:1.7cqw;display:flex;align-items:center;gap:.5em}input{width:1.5em;height:1.5em}#voice{font-size:1.2cqw}#hud{position:absolute;inset:2% 2% auto;display:flex;align-items:center;gap:.8cqw;pointer-events:none}.pill{font-weight:900;background:#fff6df;border:3px solid #693d27;border-radius:16px;padding:.45cqw 1.1cqw;font-size:1.8cqw}#hud button{pointer-events:auto;font-size:1.3cqw;margin-left:auto}#jump{position:absolute;right:2%;bottom:3%;font-size:2.3cqw;background:#ffd269;min-width:14%;padding:.7em}#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:white;font-size:12cqw;font-weight:900;-webkit-text-stroke:3px #633a22}#hint{position:absolute;left:2%;bottom:2%;font-size:1.4cqw;background:#fff6df;border:2px solid #693d27;border-radius:14px;padding:.5em .8em;pointer-events:none}.hidden{display:none!important}#result{font-size:3.5cqw;font-weight:900}#warn{position:absolute;top:15%;left:25%;width:50%;text-align:center;color:#4b2020;font-size:2.1cqw;font-weight:900;background:#ffe09a;border:3px solid #a33;border-radius:14px;pointer-events:none}.fire{position:absolute;width:8cqw;height:8cqw;padding:0;border:0;background:transparent;font-size:5.5cqw;filter:drop-shadow(0 0 10px #ff0);animation:flicker .35s infinite alternate}.fire.ready{filter:drop-shadow(0 0 18px #8ff)}.fire.out{animation:none;filter:none;font-size:4cqw;pointer-events:none}.fire:nth-child(1){left:3%;top:20%}.fire:nth-child(2){left:16%;top:43%}.fire:nth-child(3){right:5%;top:21%}.fire:nth-child(4){right:17%;top:45%}.fire:nth-child(5){left:46%;top:15%}@keyframes flicker{to{transform:scale(1.1) rotate(3deg)}}#actionVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}#waterTip{position:absolute;left:34%;bottom:2%;width:32%;text-align:center;font-size:1.6cqw;font-weight:900;background:#d9f7ff;border:3px solid #176b84;border-radius:14px;padding:.45em;pointer-events:none}
#actionVideo{position:absolute;inset:auto;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
#fires .fire{left:1.5%;right:auto;width:6.4cqw;height:6.4cqw;font-size:4.8cqw}
#fires .fire:nth-child(1){top:16%}
#fires .fire:nth-child(2){top:30%}
#fires .fire:nth-child(3){top:44%}
#fires .fire:nth-child(4){top:58%}
#fires .fire:nth-child(5){top:72%}
#count{color:#fff2bb;-webkit-text-fill-color:#fff2bb;-webkit-text-stroke:0;paint-order:normal;text-shadow:0 3px 0 #633a22,0 0 8px #633a22}
#fires .fire.out{visibility:hidden;pointer-events:none;animation:none;filter:none}
#fires .fire:nth-child(-n+3){left:1.5%;right:auto}
#fires .fire:nth-child(n+4){left:auto;right:1.5%}
#fires .fire:nth-child(1),#fires .fire:nth-child(4){top:20%}
#fires .fire:nth-child(2),#fires .fire:nth-child(5){top:42%}
#fires .fire:nth-child(3),#fires .fire:nth-child(6){top:64%}
</style>
<link rel="stylesheet" href="polish.css">
</head>
<body><div id="stage">
<canvas id="game" width="1280" height="720" aria-label="左右移動狐狸接心字部燈籠，跳過火球，再用水桶救火"></canvas>
<div id="fires" class="hidden"><button class="fire">🔥</button><button class="fire">🔥</button><button class="fire">🔥</button><button class="fire">🔥</button><button class="fire">🔥</button><button class="fire">🔥</button></div>
<canvas id="waterEffects" width="1280" height="720" aria-hidden="true"></canvas>
<video id="actionVideo" class="hidden" playsinline muted preload="auto"></video>
<div id="hud" class="hidden"><span class="pill">★ <span id="score">0</span> 分</span><span class="pill">⏱ <span id="time">60</span> 秒</span><span class="pill"><i class="art-icon bucket" aria-hidden="true"></i> 水 <span id="water">0</span></span><span class="pill"><i class="art-icon flame" aria-hidden="true"></i> 火 <span id="fireCount">6</span></span><button id="pause">暫停</button></div>
<div id="panel"><h1>心字部<br>接燈籠大作戰</h1><p id="intro">接住有「心、忄、⺗」嘅字！<br>接水桶，再撳火焰幫手救火。</p><div class="choices" id="speeds"><button data-speed="0">慢速</button><button data-speed="1">中速</button><button data-speed="2">快速</button></div><label id="challenge"><input id="fireballs" type="checkbox" checked>開啟火球挑戰</label><p id="itemsHelp">炸彈 −3 分　・　接水桶救火　・　跳高避火球</p><p id="voice" role="status">準備廣東話語音…</p><button id="start" disabled>開始遊戲</button><div id="result" class="hidden"></div><button id="again" class="hidden">再玩一次</button></div>
<div id="count"></div><div id="warn" class="hidden"></div><div id="hint" class="hidden">← 左右移動 →</div><div id="waterTip" class="hidden">有水喇！撳一堆火潑熄佢！</div><button id="jump" class="hidden">跳高！</button>
</div><script src="app.js"></script></body></html>
